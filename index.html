<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Karteikarten für Olga</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one column (max 680px), lesson chips on top, three tabs; the card is a Karteikarte:
   ruled front with an accent rule under the heading, plain back. */
:root{
  --bg:#f3f9ee; --surface:#fcfefa; --surface-2:#e4f1da; --ink:#25311f; --muted:#62725a; --line:#d6e5ca; --rule:#e6f1dd;
  --accent:#4a7a3a; --on-accent:#ffffff; --accent-text:#35602a; --accent-soft:#d0f0c0; --tea:#d0f0c0; --tea-ink:#27431f;
  --ok:#2c7a55; --ok-soft:#d9efe3; --bad:#ab362c; --bad-soft:#f7dedb;
  --shadow:0 1px 0 rgba(37,49,31,.04),0 12px 30px -14px rgba(37,49,31,.28);
  --font-display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --font-body:'Manrope',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141b11; --surface:#1d2719; --surface-2:#273322; --ink:#eaf3e3; --muted:#a9bba0; --line:#33432d; --rule:#27341f;
    --accent:#a6d894; --on-accent:#14200f; --accent-text:#cdeebd; --accent-soft:#2c4326; --tea:#2c4326; --tea-ink:#d0f0c0;
    --ok:#7fcba0; --ok-soft:#1c3427; --bad:#ec8f84; --bad-soft:#3d2321;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 14px 30px -14px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#141b11; --surface:#1d2719; --surface-2:#273322; --ink:#eaf3e3; --muted:#a9bba0; --line:#33432d; --rule:#27341f;
    --accent:#a6d894; --on-accent:#14200f; --accent-text:#cdeebd; --accent-soft:#2c4326; --tea:#2c4326; --tea-ink:#d0f0c0;
    --ok:#7fcba0; --ok-soft:#1c3427; --bad:#ec8f84; --bad-soft:#3d2321;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 14px 30px -14px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font-body);
  padding-block:10px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:8px 0 16px}
.eyebrow{margin:0 0 4px;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-text)}
h1{margin:0;font:500 clamp(36px,10vw,50px)/1 var(--font-display);letter-spacing:-.015em}
h2{margin:0 0 6px;font:500 24px/1.2 var(--font-display)}
p{margin:0}
.muted{color:var(--muted)}
.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;min-height:38px}
.lessons{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{font:600 14px/1 var(--font-body);padding:11px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:42px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.lessons .chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip small{font-weight:500;opacity:.8;margin-left:4px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{flex:1;padding:13px 4px;background:none;border:0;border-bottom:3px solid transparent;font:600 15px var(--font-body);color:var(--muted)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.meter{display:flex;align-items:center;gap:12px;margin:14px 0 0}
.meter .bar{flex:1}
.count{font-size:14px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.count b{font-weight:700}
.count .k{color:var(--ok)} .count .r{color:var(--accent-text)}

/* card */
.card3d{perspective:1400px;margin:14px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.inner{display:grid;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1);min-height:370px}
.card3d.flipped .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;
  border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px 20px 18px;min-width:0}
.front{background-image:repeating-linear-gradient(to bottom,transparent 0 33px,var(--rule) 33px 34px);background-position:0 50px}
.back{transform:rotateY(180deg)}
.card3d:not(.flipped) .back{pointer-events:none}
.card3d.flipped .front{pointer-events:none}
.head{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding-bottom:8px;border-bottom:2px solid var(--accent);background:var(--surface);margin:0 -20px;padding-left:20px;padding-right:14px}
.tag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text)}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:18px 2px;gap:10px}
.mid.left{align-items:flex-start;text-align:left}
.phrase{font:500 clamp(30px,8.5vw,46px)/1.12 var(--font-display);text-wrap:balance;overflow-wrap:anywhere;background:var(--surface);padding:2px 8px;border-radius:6px}
.phrase.uk{font-style:italic}
.phrase.sm{font-size:clamp(28px,7.5vw,38px)}
.hintline{font-size:14px;color:var(--muted);background:var(--surface);padding:0 6px}
.flipnote{text-align:center;font-size:13px;color:var(--muted);background:var(--surface);align-self:center;padding:0 8px}
.small{font-size:14px;color:var(--muted)}
.trans{font:500 clamp(24px,6.5vw,32px)/1.18 var(--font-display);text-wrap:balance}
.trans.sm{font-size:19px;color:var(--muted);font-style:italic}
.ex{font-size:17px;line-height:1.7;margin-top:4px}
.blank{min-width:5.5em;height:1.5em;border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-text);
  font:inherit;font-weight:700;padding:0 8px;border-radius:5px 5px 0 0;vertical-align:baseline}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sbtn,.icon{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font:600 14px var(--font-body);text-decoration:none}
.icon{padding:8px 10px;color:var(--accent-text);border-color:transparent;background:transparent}
.sbtn:hover,.icon:hover{border-color:var(--accent)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.btn{min-height:56px;border-radius:12px;font:700 16px var(--font-body);border:2px solid var(--accent)}
.btn.again{background:transparent;color:var(--accent-text)}
.btn.know{background:var(--accent);color:var(--on-accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);padding:0 22px}
.btn.line{background:transparent;color:var(--accent-text);padding:0 22px}
.kbd{margin-top:10px;font-size:12px;color:var(--muted);text-align:center}
@media (hover:none){.kbd{display:none}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.panel + .panel{margin-top:12px}
.list{list-style:none;margin:12px 0;padding:0;display:grid;gap:8px}
.list li{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:15px}
.list li span:last-child{color:var(--muted);text-align:right}
.bigtxt{font:500 28px/1.15 var(--font-display);margin-bottom:6px}
.actcol{display:grid;gap:10px;margin-top:14px}

/* exercises */
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.exgrid{grid-template-columns:1fr}}
.exbtn{text-align:left;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);min-height:92px;display:flex;flex-direction:column;gap:4px}
.exbtn:hover{border-color:var(--accent)}
.exbtn b{font:500 21px/1.15 var(--font-display)}
.exbtn span{font-size:13px;color:var(--muted)}
.exhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:14px}
.q{font:500 clamp(24px,6.5vw,32px)/1.2 var(--font-display);margin-bottom:14px;text-wrap:balance}
.q.uk{font-style:italic}
.opts{display:grid;gap:8px}
.opt{width:100%;text-align:left;padding:14px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.miss{border-color:var(--ok);background:transparent}
.exline{font-size:19px;line-height:2}
.gap,.dic{font:inherit;border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:5px 5px 0 0;text-align:center;max-width:100%;color:var(--ink)}
.dic{width:100%;text-align:left;font-size:19px;padding:12px}
.gap.ok,.dic.ok{border-color:var(--ok);background:var(--ok-soft)}
.gap.bad,.dic.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--ok-soft);color:var(--ink);border-left:0}
.fb.bad{background:var(--bad-soft)}
.fb b{font-weight:700}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:grid;gap:10px;align-content:start}
.pchip{min-height:64px;padding:10px 12px;text-align:left;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.pchip.de{font-family:var(--font-display);font-size:18px;font-weight:500}
.pchip.sel{border-color:var(--accent);background:var(--accent-soft)}
.pchip.done{border-color:var(--ok);background:var(--ok-soft);opacity:.7}
.pchip.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;min-height:48px}
.pill{padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font:500 17px var(--font-display);min-height:44px;text-align:left}
.pill.sel{border-color:var(--accent);background:var(--accent-soft)}
.pill.ok{border-color:var(--ok);background:var(--ok-soft)}
.pill.bad{border-color:var(--bad);background:var(--bad-soft)}
.pill small{display:block;font:600 11px var(--font-body);color:var(--bad);margin-top:2px}
.groups{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.gbox{border:1.5px solid var(--line);border-radius:12px;padding:12px;min-height:120px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:8px;align-items:flex-start;width:100%}
.gbox.armed{border-color:var(--accent);background:var(--accent-soft)}
.gbox h3{margin:0;font:700 14px var(--font-body);color:var(--accent-text);letter-spacing:.02em}
.gbox .pool{margin:0;min-height:0}
.field{width:100%;min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:10px 12px;font-size:16px}
textarea.field{min-height:92px;resize:vertical;font-size:14px}
select.field{appearance:auto}
.fieldlbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.note{font-size:14px;color:var(--muted);margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--accent-soft);border-radius:10px;padding:12px;text-align:center}
.stat b{display:block;font:500 28px/1 var(--font-display);color:var(--accent-text);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.danger{border-color:var(--bad);color:var(--bad)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){
  .inner,.bar i,#toast{transition:none}
  .pchip.wrong{animation:none}
}

/* Зелений чай — стиль як у Лізи: заокруглені картки, тінь, сегментні вкладки */
h1{font-weight:700;font-size:clamp(28px,7vw,40px);line-height:1.05;letter-spacing:0}
h2,.bigtxt,.trans,.q,.exbtn b,.pchip.de,.pill{font-weight:600}
.eyebrow{color:var(--muted);letter-spacing:.12em}
.phrase{font-weight:700;font-size:clamp(26px,6.4vw,40px)}
.phrase.sm{font-size:clamp(24px,6vw,34px)}
.phrase.uk,.q.uk,.trans.sm{font-style:normal}
.tabs{gap:4px;padding:4px;background:var(--surface-2);border:0;border-radius:14px}
.tabs button{border:0;border-radius:10px;padding:10px 4px;font-weight:700}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chip{font-weight:700;font-size:13px;padding:9px 13px;min-height:38px}
.lessons .chip.on{background:var(--tea);border-color:var(--accent);color:var(--tea-ink)}
.face{border-radius:22px;box-shadow:var(--shadow)}
.front{background-image:none}
.head{border-bottom:1px dashed var(--line)}
.panel,.qcard{border-radius:18px;box-shadow:var(--shadow)}
.bar{background:var(--surface-2)}
.btn.know,.btn.primary{background:var(--accent);border-color:var(--accent)}
.btn.again,.btn.line{border-color:var(--line)}
.blank,.gap,.dic{background:var(--tea);color:var(--tea-ink);border-bottom-color:var(--accent)}
.opt.sel,.pchip.sel,.pill.sel,.gbox.armed{background:var(--tea);color:var(--tea-ink)}
.list li{background:var(--surface-2)}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">Картки фраз · німецька · B2</p>
      <h1>Olga</h1>
    </div>
    <button class="ghost" id="themeBtn" data-act="theme" type="button">Тема: авто</button>
  </header>
  <div class="lessons" id="lessons"></div>
  <nav class="tabs" id="tabs" aria-label="Розділи"></nav>
  <main id="view"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ================= DATA =================
   Додавайте нові фрази в кінець CARDS (поле lesson — назва уроку, нова назва = нова кнопка).
   Поле en містить саму фразу (тут німецьку): за ним зберігається прогрес. */
const CARDS = [
 {lesson:'Werkzeuge 1', en:'der Mundspiegel', uk:'стоматологічне дзеркало',
  ex:'Die Zahnärztin kontrolliert mit dem ___ die Rückseite der Schneidezähne.', ans:'Mundspiegel',
  col:['den Mundspiegel anwärmen','die Wange mit dem Mundspiegel abhalten'], dict:'Mundspiegel'},
 {lesson:'Werkzeuge 1', en:'die Sonde', uk:'зонд',
  ex:'Mit der ___ tastet der Zahnarzt die Zahnoberfläche nach Karies ab.', ans:'Sonde',
  col:['mit der Sonde abtasten','die Sonde ansetzen'], dict:'Sonde'},
 {lesson:'Werkzeuge 1', en:'die Häkchensonden', uk:'гачкуваті зонди (з гачком на кінці)',
  ex:'Auf dem Instrumententablett liegen zwei ___ bereit.', ans:'Häkchensonden',
  col:['Häkchensonden bereitlegen','mit der Häkchensonde arbeiten'], dict:'Sonde'},
 {lesson:'Werkzeuge 1', en:'die Messsonde', uk:'вимірювальний (пародонтальний) зонд',
  ex:'Mit der ___ misst die Dentalhygienikerin die Tiefe der Zahnfleischtaschen.', ans:'Messsonde',
  col:['die Taschentiefe messen','die Messsonde vorsichtig einführen'], dict:'Messsonde'},
 {lesson:'Werkzeuge 1', en:'die biegbare Sonde', uk:'гнучкий зонд (його можна зігнути)',
  ex:'Die ___ Sonde lässt sich an die Form des Wurzelkanals anpassen.', ans:'biegbare',
  col:['eine biegbare Sonde verwenden','die Sonde biegen'], dict:'biegbar'},
 {lesson:'Werkzeuge 1', en:'biegen', uk:'згинати',
  ex:'Man kann die dünne Sonde leicht ___, um schwer erreichbare Stellen zu erreichen.', ans:'biegen',
  col:['die Spitze biegen','einen Draht biegen'], dict:'biegen'},
 {lesson:'Werkzeuge 1', en:'die Turbine', uk:'турбінний наконечник (бормашина)',
  ex:'Mit der ___ trägt der Zahnarzt die kariöse Zahnsubstanz schnell ab.', ans:'Turbine',
  col:['mit der Turbine bohren','die Turbine mit Wasser kühlen'], dict:'Turbine'},
 {lesson:'Werkzeuge 1', en:'die Pinzette', uk:'пінцет',
  ex:'Mit der ___ nimmt der Zahnarzt die Watterolle aus dem Behälter.', ans:'Pinzette',
  col:['die Pinzette reichen','etwas mit der Pinzette greifen'], dict:'Pinzette'},
 {lesson:'Werkzeuge 1', en:'der Scaler', uk:'скейлер (для видалення зубного каменю)',
  ex:'Mit dem ___ entfernt die Prophylaxeassistentin harte Beläge am Zahnfleischrand.', ans:'Scaler',
  col:['Zahnstein mit dem Scaler entfernen','den Scaler schärfen'], dict:'Scaler'},
 {lesson:'Werkzeuge 1', en:'die Matrize', uk:'матриця (формує стінку зуба для пломби)',
  ex:'Vor der Füllung spannt der Zahnarzt eine ___ um den Backenzahn.', ans:'Matrize',
  col:['eine Matrize anlegen','die Matrize einspannen'], dict:'Matrize'},
 {lesson:'Werkzeuge 1', en:'die Polierbürste', uk:'щіточка для полірування',
  ex:'Zum Schluss poliert die Assistentin die Zähne mit der ___ und etwas Polierpaste.', ans:'Polierbürste',
  col:['mit der Polierbürste polieren','die Polierbürste aufsetzen'], dict:'Polierbürste'},
 {lesson:'Werkzeuge 1', en:'der Poliergummi', uk:'полірувальна гумка (гумовий полірувальник)',
  ex:'Mit dem ___ glättet der Zahnarzt die Oberfläche der neuen Füllung.', ans:'Poliergummi',
  col:['den Poliergummi aufsetzen','eine Füllung mit dem Poliergummi polieren'], dict:'Poliergummi'},
 {lesson:'Werkzeuge 1', en:'der große Absauger', uk:'великий відсмоктувач (хірургічний)',
  ex:'Bei der Extraktion hält die Assistentin den großen ___ nahe an die Wunde.', ans:'Absauger',
  col:['Blut absaugen','den Absauger halten'], dict:'Absauger'},
 {lesson:'Werkzeuge 1', en:'der Speichelzieher', uk:'слиновідсмоктувач',
  ex:'Die Assistentin legt dem Patienten den ___ unter die Zunge.', ans:'Speichelzieher',
  col:['den Speichelzieher platzieren','Speichel absaugen'], dict:'Speichelzieher'},
 {lesson:'Werkzeuge 1', en:'die Kürette', uk:'кюрета',
  ex:'Mit der ___ reinigt der Zahnarzt die Wurzeloberfläche unter dem Zahnfleisch.', ans:'Kürette',
  col:['mit der Kürette arbeiten','die Zahnfleischtasche mit der Kürette reinigen'], dict:'Kürette'},
 {lesson:'Werkzeuge 1', en:'der Ultraschall', uk:'ультразвук (ультразвуковий скейлер)',
  ex:'Der ___ löst den Zahnstein mit Vibrationen und Wasser.', ans:'Ultraschall',
  col:['mit Ultraschall arbeiten','Zahnstein per Ultraschall entfernen'], dict:'Ultraschall'},

const INTERVALS=[1,3,7,14,30,60];
const BATCH=20;
const MAP={}; CARDS.forEach(c=>{MAP[c.en]=c;});
const LESSONS=[...new Set(CARDS.map(c=>c.lesson))].sort((a,b)=>a.localeCompare(b,'de',{numeric:true}));

const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const today=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/864e5);};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;};
const norm=s=>String(s).toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();

/* ================= STORAGE ================= */
const mem={};
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return (k in mem)?mem[k]:null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){mem[k]=v;}}
function load(k,def){try{const s=lsGet(k);return s?JSON.parse(s):def;}catch(e){return def;}}
function save(k,v){try{lsSet(k,JSON.stringify(v));}catch(e){}}
const K={prog:'olga.cards.prog.v1',sess:'olga.cards.sess.v1',set:'olga.cards.set.v1',theme:'olga.cards.theme'};
let prog=load(K.prog,{}); if(!prog||typeof prog!=='object')prog={};
let S=Object.assign({mode:'today',random:false,rev:false,lessons:null,voice:''},load(K.set,{}));
let sess=load(K.sess,null);
const sel=()=>{const l=Array.isArray(S.lessons)?S.lessons.filter(x=>LESSONS.includes(x)):[];return l.length?l:LESSONS.slice();};
const selectedCards=()=>{const s=sel();return CARDS.filter(c=>s.includes(c.lesson));};
const saveS=()=>save(K.set,S);
const getP=en=>prog[en]||{lvl:0,due:0,again:false,seen:false};
function mark(en,kind){
  const p=Object.assign({},getP(en));p.seen=true;
  if(kind==='know'){p.lvl=(p.lvl||0)+1;p.due=today()+INTERVALS[Math.min(p.lvl-1,INTERVALS.length-1)];p.again=false;}
  else{p.lvl=0;p.due=today();p.again=true;}
  prog[en]=p;save(K.prog,prog);
}

const JOKE=/^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy)\b/i;
const GOOD=/natural|neural|premium|enhanced|siri|google/i;
function voices(){try{return window.speechSynthesis.getVoices().filter(v=>/^de/i.test(v.lang)&&!JOKE.test(v.name));}catch(e){return [];}}
function scoreV(v){let s=0;if(GOOD.test(v.name))s+=10;if(/premium|neural|natural/i.test(v.name))s+=4;if(/enhanced|siri/i.test(v.name))s+=2;if(/^de[-_]DE/i.test(v.lang))s+=2;return s;}
function bestVoice(){
  const vs=voices().sort((a,b)=>scoreV(b)-scoreV(a));
  if(S.voice){const f=vs.find(v=>v.voiceURI===S.voice||v.name===S.voice);if(f)return f;}
  return vs[0]||null;
}
function speak(text,rate){
  try{
    const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';
    const v=bestVoice();if(v){u.voice=v;u.lang=v.lang;}
    u.rate=rate||0.95;
    window.speechSynthesis.cancel();window.speechSynthesis.speak(u);
  }catch(e){}
}
const sayText=c=>(c.say||c.en).replace(/\.{2,}|…/g,' ').replace(/\s+/g,' ').trim();
try{window.speechSynthesis.addEventListener('voiceschanged',()=>{if(ui.tab==='set')render();});}catch(e){}

/* ================= SESSION ================= */
function buildIds(mode){
  const cs=selectedCards(),t=today();
  const A=cs.filter(c=>getP(c.en).again);
  const B=cs.filter(c=>{const p=getP(c.en);return p.seen&&!p.again&&p.due<=t;});
  const C=cs.filter(c=>!getP(c.en).seen);
  const mix=a=>S.random?shuffle(a):a;
  let list;
  if(mode==='today')list=mix(A).concat(mix(B),mix(C)).slice(0,BATCH);
  else if(mode==='all')list=mix(cs);
  else if(mode==='again')list=mix(A);
  else list=mix(C);
  return list.map(c=>c.en);
}
function newSession(mode,ids,custom){
  sess={mode:mode,lessons:sel().join('|'),ids:ids||buildIds(mode),idx:0,res:{},custom:!!custom};
  save(K.sess,sess);ui.flipped=false;ui.revealed=false;
}
function ensureSession(){
  if(!sess||!Array.isArray(sess.ids)||sess.mode!==S.mode||sess.lessons!==sel().join('|')||!sess.ids.every(id=>MAP[id]))newSession(S.mode);
}
function answer(kind){
  ensureSession();
  const id=sess.ids[sess.idx];if(!id)return;
  mark(id,kind);sess.res[id]=kind;sess.idx++;
  ui.flipped=false;ui.revealed=false;save(K.sess,sess);render();
}

function startEx(type){
  const cs=exPool();

  if(need&&cs.length<need){toast(ui.exSrc==='again'?'Немає слів для повторення':'У вибраних уроках немає фраз');return;}
  if(type==='pairs'){
    const items=shuffle(cs).slice(0,6);
    ex={type,items,right:shuffle(items.map(c=>c.en)),matched:[],sel:null,mist:new Set(),flash:null,done:false};
  }else if(type==='gap'){
    ex={type,items:shuffle(cs).slice(0,10),i:0,score:0,mist:[],cur:{checked:false,ok:false,hint:false,val:''},done:false};
  }else if(type==='quiz'){
    const all=selectedCards();
    const items=shuffle(cs).slice(0,10).map(c=>{
      let others=shuffle(all.filter(x=>x.en!==c.en));
      if(others.length<3)others=others.concat(shuffle(CARDS.filter(x=>x.en!==c.en&&!others.includes(x))));
      return {c:c,dir:Math.random()<.5?'de':'uk',opts:shuffle([c].concat(others.slice(0,3)))};
    });
    ex={type,items,i:0,score:0,mist:[],cur:{pick:null},done:false};
  }else if(type==='dict'){
    ex={type,items:shuffle(cs).slice(0,8),i:0,score:0,mist:[],cur:{checked:false,ok:false,val:''},done:false};
  }else if(type==='forks'){
    const s=sel(),fk=shuffle(FORKS.filter(f=>s.includes(f.lesson)));
    if(!fk.length){toast('Для вибраних уроків немає виделок');return;}
    ex={type,items:fk,i:0,score:0,mist:[],cur:null,done:false};forkCur();
  }else if(type==='sorts'){
    const s=sel(),st=SORTS.filter(f=>s.includes(f.lesson));
    if(!st.length){toast('Для вибраних уроків немає категорій');return;}
    const set=st[Math.floor(Math.random()*st.length)];
    const phrases=[];Object.keys(set.cats).forEach(k=>set.cats[k].forEach(p=>phrases.push(p)));
    ex={type,set,keys:Object.keys(set.cats),pool:shuffle(phrases),placed:{},sel:null,checked:false,mist:[],done:false};
  }
  render();
}

/* --- pairs --- */
function pairsHtml(){
  const m=ex.matched,fl=ex.flash||[];
  const chip=(side,id,txt)=>{
    const done=m.includes(id),on=ex.sel&&ex.sel.side===side&&ex.sel.id===id;
    return '<button class="pchip '+(side==='L'?'de':'')+(done?' done':'')+(on?' sel':'')+(fl.includes(side+id)?' wrong':'')+'" data-act="pair" data-side="'+side+'" data-id="'+esc(id)+'" '+(done?'disabled':'')+' type="button">'+esc(txt)+'</button>';
  };
  let h=exHead(m.length+1,ex.items.length+1)+'<p class="note" style="margin:12px 0">Торкніться фрази, потім її перекладу.</p>'+
    '<div class="pairs"><div class="col">'+ex.items.map(c=>chip('L',c.en,c.en)).join('')+'</div><div class="col">'+ex.right.map(id=>chip('R',id,MAP[id].uk)).join('')+'</div></div>';
  if(ex.done){ex.mist=[...ex.mist instanceof Set?ex.mist:new Set(ex.mist)];h+=resultHtml(ex.items.length-ex.mist.length,ex.items.length,true);}
  return h;
}
function pairClick(side,id){
  if(ex.matched.includes(id))return;
  if(!ex.sel||ex.sel.side===side){ex.sel={side,id};}
  else{
    const a=ex.sel;ex.sel=null;
    if(a.id===id){ex.matched.push(id);if(ex.matched.length===ex.items.length)ex.done=true;}
    else{
      ex.mist.add(side==='L'?id:a.id);ex.flash=[a.side+a.id,side+id];
      setTimeout(()=>{if(ex&&ex.type==='pairs'){ex.flash=null;render();}},500);
    }
  }
  render();
}

function gapCheck(){
  const c=ex.items[ex.i],inp=$('#gapIn');if(!inp||ex.cur.checked)return;
  const v=inp.value;if(!v.trim()){inp.focus();return;}
  ex.cur.val=v;ex.cur.checked=true;ex.cur.ok=norm(v)===norm(c.ans);
  if(ex.cur.ok)ex.score++;else ex.mist.push(c.en);

}
function nextIn(type,fresh){
  ex.i++;
  if(ex.i>=ex.items.length){ex.done=true;}else{ex.cur=fresh();}

/* --- forks --- */
function forkCur(){
  const f=ex.items[ex.i];
  ex.cur={opts:shuffle(f.ok.map(t=>({t:t,ok:true})).concat(f.bad.map(t=>({t:t,ok:false})))),sel:[],checked:false,right:false};
}
function forksHtml(){
  if(ex.done)return exHead(0,0)+'<div class="panel" style="margin-top:14px"><p class="bigtxt">Результат: '+ex.score+' з '+ex.items.length+'</p><p class="muted">Виделка зарахована, якщо обрано рівно всі потрібні слова.</p><div class="actcol"><button class="btn line" data-act="exagain" type="button">Ще раз</button><button class="btn line" data-act="exback" type="button">До вправ</button></div></div>';
  const f=ex.items[ex.i],cu=ex.cur;
  const opts=cu.opts.map((o,i)=>{
    const on=cu.sel.includes(i);let cls=on?'sel':'';
    if(cu.checked){if(o.ok&&on)cls='ok';else if(o.ok&&!on)cls='miss';else if(!o.ok&&on)cls='bad';else cls='';}
    return '<button class="opt '+cls+'" data-act="forktoggle" data-i="'+i+'" '+(cu.checked?'disabled':'')+' aria-pressed="'+on+'" type="button">'+esc(o.t)+'</button>';
  }).join('');
  let h=exHead(ex.i+1,ex.items.length)+'<div class="qcard"><p class="note" style="margin:0 0 6px">Що поєднується зі словом? Оберіть усі підходящі.</p><p class="q">'+esc(f.word)+'</p><div class="opts">'+opts+'</div>';
  if(!cu.checked)h+='<div class="btnrow" style="margin-top:14px"><button class="btn primary" data-act="forkcheck" type="button">Перевірити</button></div>';
  else h+='<div class="fb '+(cu.right?'ok':'bad')+'"><b>'+(cu.right?'Правильно.':'Не зовсім.')+'</b> '+esc(f.why)+'</div><div class="btnrow" style="margin-top:14px"><button class="btn primary" data-act="forknext" type="button">'+(ex.i+1>=ex.items.length?'Результат':'Далі')+'</button></div>';
  return h+'</div>';
}

  const poolItems=ex.pool.filter(p=>!(p in ex.placed));

  let h=exHead(placedKeys.length+1,ex.pool.length+1)+'<div class="qcard"><p class="note" style="margin:0 0 4px">'+esc(st.title)+'</p><p class="note" style="margin:0">Торкніться фрази, потім групи.</p>'+
    '<div class="pool">'+(poolItems.length?poolItems.map(p=>pill(p,'sortpick')).join(''):'<span class="note">Усі фрази розкладено.</span>')+'</div>'+
    '<div class="groups">'+ex.keys.map((k,gi)=>{

        }).join('')+'</div></div>';

  if(!ex.checked)h+='<div class="btnrow" style="margin-top:14px"><button class="btn primary" data-act="sortcheck" type="button" '+(poolItems.length?'disabled':'')+'>Перевірити</button></div>';

      '<div class="btnrow" style="margin-top:14px"><button class="btn primary" data-act="exagain" type="button">Ще раз</button><button class="btn line" data-act="exback" type="button">До вправ</button></div>';

function render(){

/* ================= EVENTS ================= */
function encode(){
  const s=JSON.stringify({v:1,prog:prog});const b=new TextEncoder().encode(s);let r='';b.forEach(x=>{r+=String.fromCharCode(x);});return 'OLGA1:'+btoa(r);
}
function decode(code){
  code=code.trim();if(code.indexOf('OLGA1:')!==0)throw new Error('format');
  const r=atob(code.slice(6));const b=Uint8Array.from(r,ch=>ch.charCodeAt(0));
  const o=JSON.parse(new TextDecoder().decode(b));if(!o||typeof o.prog!=='object')throw new Error('format');
  const out={};Object.keys(o.prog).forEach(k=>{const p=o.prog[k]||{};out[k]={lvl:+p.lvl||0,due:+p.due||0,again:!!p.again,seen:!!p.seen};});
  return out;
}
function act(a,t){
  switch(a){
    case 'tab':ui.tab=t.dataset.v;render();break;
    case 'theme':{const o=['auto','light','dark'],c=lsGet(K.theme)||'auto';lsSet(K.theme,o[(o.indexOf(c)+1)%3]);applyTheme();break;}
    case 'lessonAll':S.lessons=null;saveS();ex=null;newSession(S.mode);render();break;
    case 'lesson':{
      const l=t.dataset.v,cur=sel(),all=cur.length===LESSONS.length;let n;
      if(all&&LESSONS.length>1)n=[l];else if(cur.includes(l))n=cur.filter(x=>x!==l);else n=cur.concat([l]);
      if(!n.length)n=LESSONS.slice();
      S.lessons=n;saveS();ex=null;newSession(S.mode);render();break;
    }
    case 'mode':S.mode=t.dataset.v;saveS();ui.tab='cards';newSession(S.mode);render();break;
    case 'random':S.random=!S.random;saveS();newSession(S.mode);render();break;
    case 'rev':S.rev=!S.rev;saveS();ui.flipped=false;ui.revealed=false;render();break;
    case 'restart':{ensureSession();const ids=S.random?shuffle(sess.ids):sess.ids.slice();newSession(S.mode,ids,sess.custom);render();break;}
    case 'know':answer('know');break;
    case 'again':answer('again');break;
    case 'reveal':ui.revealed=!ui.revealed;render();break;
    case 'speak':{const c=CARDS[+t.dataset.k];if(c)speak(sayText(c));break;}
    case 'againWords':{const ids=sess.ids.filter(i=>sess.res[i]==='again');newSession(S.mode,ids,true);render();break;}
    case 'more':newSession(S.mode);render();break;
    case 'toex':ui.tab='ex';ex=null;render();break;
    /* exercises */
    case 'src':ui.exSrc=t.dataset.v;render();break;
    case 'exstart':startEx(t.dataset.v);break;
    case 'exback':ex=null;render();break;
    case 'exagain':{const ty=ex.type;startEx(ty);break;}
    case 'exadd':{(ex.mist instanceof Set?[...ex.mist]:ex.mist).forEach(en=>mark(en,'again'));ex.added=true;toast('Слова додано в повторення');render();break;}
    case 'pair':pairClick(t.dataset.side,t.dataset.id);break;
    case 'gaphint':{const c=ex.items[ex.i],inp=$('#gapIn');if(inp&&!ex.cur.checked){if(!inp.value)inp.value=c.ans.charAt(0);ex.cur.hint=true;inp.focus();}break;}
    case 'gapcheck':gapCheck();break;
    case 'gapnext':nextIn('gap',()=>({checked:false,ok:false,hint:false,val:''}));break;
    case 'quizpick':{const cu=ex.cur;if(cu.pick!==null)break;const it=ex.items[ex.i];cu.pick=+t.dataset.i;
      if(it.opts[cu.pick].en===it.c.en)ex.score++;else ex.mist.push(it.c.en);render();break;}
    case 'quiznext':nextIn('quiz',()=>({pick:null}));break;
    case 'dicplay':speak(sayText(ex.items[ex.i]),0.95);break;
    case 'dicslow':speak(sayText(ex.items[ex.i]),0.55);break;
    case 'diccheck':{const c=ex.items[ex.i],inp=$('#dicIn');if(!inp||ex.cur.checked)break;
      if(!inp.value.trim()){inp.focus();break;}
      ex.cur.val=inp.value;ex.cur.checked=true;ex.cur.ok=norm(inp.value)===norm(c.en);
      if(ex.cur.ok)ex.score++;else ex.mist.push(c.en);render();break;}
    case 'dicnext':nextIn('dict',()=>({checked:false,ok:false,val:''}));break;
    case 'forktoggle':{const cu=ex.cur;if(cu.checked)break;const i=+t.dataset.i,p=cu.sel.indexOf(i);if(p>=0)cu.sel.splice(p,1);else cu.sel.push(i);render();break;}
    case 'forkcheck':{const cu=ex.cur;cu.checked=true;
      cu.right=cu.opts.every((o,i)=>o.ok===cu.sel.includes(i));if(cu.right)ex.score++;render();break;}
    case 'forknext':nextIn('forks',()=>{forkCur();return ex.cur;});break;
    case 'sortpick':ex.sel=ex.sel===t.dataset.p?null:t.dataset.p;render();break;
    case 'sortplace':if(ex.sel&&!ex.checked){ex.placed[ex.sel]=+t.dataset.g;ex.sel=null;render();}break;
    case 'sortunplace':if(!ex.checked){delete ex.placed[t.dataset.p];ex.sel=null;render();}break;
    case 'sortcheck':{ex.checked=true;ex.mist=[];
      ex.pool.forEach(p=>{const g=ex.placed[p];if(!ex.set.cats[ex.keys[g]].includes(p))ex.mist.push(p);});render();break;}
    /* settings */
    case 'voicetest':speak('Der Mundspiegel liegt auf dem Instrumententablett.');break;
    case 'copycode':{
      const code=encode();ui.codeOut='';
      const fallback=()=>{ui.codeOut=code;ui.codeMsg='Скопіюйте код вручну з поля вище.';render();const o=$('#codeOut');if(o){o.focus();o.select();}};
      try{navigator.clipboard.writeText(code).then(()=>{ui.codeMsg='Код скопійовано. Вставте його на іншому пристрої.';render();},fallback);}catch(e){fallback();}
      break;}
    case 'importcode':{
      const v=($('#codeIn')||{}).value||'';
      try{prog=decode(v);save(K.prog,prog);sess=null;save(K.sess,null);ui.codeMsg='Прогрес відновлено.';ui.codeOut='';}
      catch(e){ui.codeMsg='Не вдалося прочитати код. Скопіюйте його повністю, разом із початком OLGA1:.';}
      render();break;}
    case 'reset':
      if(!ui.resetArm){ui.resetArm=true;render();clearTimeout(act.rt);act.rt=setTimeout(()=>{ui.resetArm=false;if(ui.tab==='set')render();},4000);}
      else{ui.resetArm=false;prog={};save(K.prog,prog);sess=null;save(K.sess,null);ex=null;ui.codeMsg='Прогрес скинуто.';ui.codeOut='';render();}
      break;
  }
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(t){act(t.dataset.act,t);return;}
  if(e.target.closest('a'))return;
  if(e.target.closest('#card')){ui.flipped=!ui.flipped;const c=$('#card');if(c)c.classList.toggle('flipped',ui.flipped);}
});
document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='voiceSel'){S.voice=e.target.value;saveS();speak('Der Mundspiegel liegt auf dem Instrumententablett.');}
});
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(e.key==='Enter'&&tag==='input'){
    if(e.target.id==='gapIn'){e.preventDefault();gapCheck();}
    else if(e.target.id==='dicIn'){e.preventDefault();act('diccheck',e.target);}
    return;
  }
  if(tag==='input'||tag==='textarea'||tag==='select')return;
  if(ui.tab==='ex'&&ex&&ex.type==='sorts'&&(e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('gbox')){e.preventDefault();act('sortplace',e.target);return;}
  if(ui.tab!=='cards'||!$('#card'))return;
  if(e.key===' '){e.preventDefault();ui.flipped=!ui.flipped;$('#card').classList.toggle('flipped',ui.flipped);}
  else if(e.key==='ArrowLeft'){e.preventDefault();answer('again');}
  else if(e.key==='ArrowRight'){e.preventDefault();answer('know');}
  else if(e.key==='Enter'&&e.target.id==='card'){e.preventDefault();ui.flipped=!ui.flipped;$('#card').classList.toggle('flipped',ui.flipped);}
});

applyTheme();
render();
})();
</script>

</body></html>
